<script>
// EXACT SAME SCRIPT FROM WHEY (no changes)
document.getElementById("cart-btn").onclick = () => {
    document.getElementById("cart-panel").classList.add("active");
};

document.getElementById("close-cart").onclick = () => {
    document.getElementById("cart-panel").classList.remove("active");
};

let currentProductName = "";
let currentProductPrice = "";

function openOrderModal(button) {
    const card = button.closest('.product-card');
    const name = card.querySelector("h1").innerText;
    const price = card.querySelector(".price").innerText;

    currentProductName = name;
    currentProductPrice = price;

    document.getElementById("modal-product-name").innerText = name;

    document.getElementById("order-modal").classList.add("active");
}

function closeOrderModal() {
    document.getElementById("order-modal").classList.remove("active");
    activePromo = null;
    const msg = document.getElementById("modal-promo-message");
    const input = document.getElementById("modal-promo-input");
    if (msg) msg.innerText = "";
    if (input) input.value = "";
}
function selectChoice(type, btn) {
    document.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    if (type === "whatsapp") {
        const message = `Hello, I want to order:
Product: ${currentProductName}

Price: ${currentProductPrice}`;

        window.open(`https://wa.me/96171236230?text=${encodeURIComponent(message)}`, "_blank");
        closeOrderModal();
    } else {
        document.getElementById("order-form").classList.add("active");
        document.getElementById("modal-divider").style.display = "block";
    }
}

function submitOrderForm() {
    const name    = document.getElementById("client-name").value.trim();
    const phone   = document.getElementById("client-phone").value.trim();
    const address = document.getElementById("client-address").value.trim();
    const notes   = document.getElementById("client-notes").value.trim();

    if (!name || !phone || !address) {
        alert("Please fill in your name, phone, and address.");
        return;
    }

    const rawPrice = parseFloat(currentProductPrice.replace("$", ""));
    const discount = activePromo ? activePromo.discount : 0;
    const finalPrice = rawPrice * (1 - discount / 100);

    const promoLine = activePromo
        ? `🏷️ Promo   : ${activePromo.code} (-${discount}%)\n✅ Final   : $${finalPrice.toFixed(2)}`
        : `💰 Price   : ${currentProductPrice}`;

    const message =
`🛒 New Order!
──────────────────
Product : ${currentProductName}
${promoLine}
──────────────────
👤 Name    : ${name}
📞 Phone   : ${phone}
📍 Address : ${address}
📝 Notes   : ${notes || "—"}
──────────────────`;

    window.open(`https://wa.me/96171236230?text=${encodeURIComponent(message)}`, "_blank");
    closeOrderModal();
}
function toggleDesc(btn) {
    const card = btn.closest('.product-card');
    const panel = card.querySelector('.desc-panel');
    const isOpen = panel.classList.contains('open');
    // Close all open panels first
    document.querySelectorAll('.desc-panel.open').forEach(p => p.classList.remove('open'));
    if (!isOpen) panel.classList.add('open');
}
function slideImage(btn, direction) {
  const slider = btn.closest('.product-image.slider');
  const slides = slider.querySelectorAll('.slide');
  let current = [...slides].findIndex(s => s.classList.contains('active'));
  slides[current].classList.remove('active');
  let next = (current + direction + slides.length) % slides.length;
  slides[next].classList.add('active');
}

// Make active slide images tappable — run once on load
document.querySelectorAll('.product-image.slider').forEach(slider => {
  slider.querySelectorAll('.slide').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
      if (img.classList.contains('active')) {
        openLightbox(img.src);
      }
    });
  });
});
function applyModalPromo() {
    const input = document.getElementById("modal-promo-input");
    const message = document.getElementById("modal-promo-message");
    const code = input.value.trim().toUpperCase();

    if (promoCodes[code]) {
        activePromo = { code, discount: promoCodes[code] };
        message.style.color = "green";
        message.innerText = `✔ "${code}" applied — ${promoCodes[code]}% off!`;
    } else {
        activePromo = null;
        message.style.color = "red";
        message.innerText = "❌ Invalid promo code.";
    }
}
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});
// Make regular (non-slider) product images tappable
document.querySelectorAll('.product-image:not(.slider) img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
        openLightbox(img.src);
    });
});
</script>
